<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse Iran 24 — نوار خبر لایو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ====== تنظیم سریع (یا با پارامتر آدرس) ======
     ?pps=45      سرعت، پیکسل بر ثانیه (کمتر = آرام‌تر)
     ?bottom=220  فاصله نوار از پایین صفحه، پیکسل
     ?h=78        ارتفاع نوار
     ?src=...     آدرس فید خبر (اختیاری)
  */
  :root{
    --brand:#8C1D18;
    --gold:#C9A227;
    --ink:#0E1016;
    --text:#FFFFFF;
    --bar-h:78px;
    --bar-bottom:200px;
    --pps:45;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:transparent;overflow:hidden}
  body{font-family:'Vazirmatn',Tahoma,sans-serif}

  .bar{
    position:fixed; right:0; left:0; bottom:var(--bar-bottom);
    height:var(--bar-h);
    display:flex; align-items:stretch;
    background:linear-gradient(180deg,rgba(14,16,22,.92),rgba(14,16,22,.98));
    border-top:3px solid var(--gold);
    box-shadow:0 -6px 24px rgba(0,0,0,.45);
    direction:rtl;
  }

  /* ---- نشان کانال (سمت راست) ---- */
  .badge{
    flex:0 0 auto; display:flex; align-items:center; gap:12px;
    padding:0 22px 0 26px;
    background:linear-gradient(180deg,#A32420,var(--brand));
    color:#fff;
    clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%);
  }
  .badge .name{font-weight:900;font-size:23px;letter-spacing:.2px;line-height:1.15}
  .badge .site{font-weight:500;font-size:14px;opacity:.9;direction:ltr;unicode-bidi:isolate}
  .ecg{width:52px;height:34px;flex:0 0 auto}
  .ecg path{
    fill:none;stroke:var(--gold);stroke-width:3;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:120;stroke-dashoffset:120;
    animation:beat 2.1s linear infinite;
  }
  @keyframes beat{to{stroke-dashoffset:-120}}

  /* ---- نوار متحرک ---- */
  .track{position:relative;flex:1 1 auto;overflow:hidden}
  .move{
    position:absolute; top:0; right:0; height:100%;
    width:max-content;
    display:flex; align-items:center; white-space:nowrap;
    direction:rtl; will-change:transform;
    animation:slide 40s linear infinite;
  }
  /* حرکت از چپ به راست: اولِ خبر زودتر از همه دیده می‌شود */
  @keyframes slide{
    from{transform:translateX(0)}
    to{transform:translateX(50%)}
  }
  .item{
    flex:0 0 auto;
    color:var(--text); font-size:26px; font-weight:500;
    padding:0 26px; display:inline-flex; align-items:center; gap:14px;
    direction:rtl; unicode-bidi:isolate;
  }
  .item::after{content:"◆";color:var(--gold);font-size:14px;opacity:.85}

  /* ---- ساعت (سمت چپ) ---- */
  .clock{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:0 20px; background:rgba(255,255,255,.05);
    border-right:1px solid rgba(255,255,255,.12);
    color:#fff; font-weight:700; font-size:22px;
    direction:ltr; unicode-bidi:isolate;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:#FF3B3B;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.15}}
</style>
</head>
<body>

<div class="bar">
  <div class="badge">
    <svg class="ecg" viewBox="0 0 60 34" aria-hidden="true">
      <path d="M1 20 H14 L19 8 L25 28 L31 14 L36 20 H59"/>
    </svg>
    <div>
      <div class="name">پالس ایران ۲۴</div>
      <div class="site">pulseiran24.com</div>
    </div>
  </div>

  <div class="track"><div class="move" id="move"></div></div>

  <div class="clock"><span class="dot"></span><span id="time">--:--</span></div>
</div>

<script>
/* ---------- پارامترهای آدرس ---------- */
const P = new URLSearchParams(location.search);
const root = document.documentElement.style;
if (P.get("pps"))    root.setProperty("--pps", P.get("pps"));
if (P.get("bottom")) root.setProperty("--bar-bottom", P.get("bottom") + "px");
if (P.get("h"))      root.setProperty("--bar-h", P.get("h") + "px");

/* ---------- ساعت ---------- */
function tick(){
  const d = new Date();
  document.getElementById("time").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
tick(); setInterval(tick, 10000);

/* ---------- متن پیش‌فرض ---------- */
const FALLBACK = [
  "پالس ایران ۲۴ — اخبار لحظه‌به‌لحظه ایران و جهان",
  "آخرین خبرها را در pulseiran24.com دنبال کنید"
];

/* ---------- گرفتن تیترها ---------- */
const FEEDS = P.get("src")
  ? [P.get("src")]
  : ["/rss.xml", "/feed.xml", "/rss", "/feed", "/index.xml"];

async function fetchFeed(){
  for (const url of FEEDS){
    try{
      const r = await fetch(url, {cache:"no-store"});
      if (!r.ok) continue;
      const xml = new DOMParser().parseFromString(await r.text(), "text/xml");
      const titles = [...xml.querySelectorAll("item > title, entry > title")]
        .map(n => (n.textContent || "").trim())
        .filter(Boolean)
        .slice(0, 15);
      if (titles.length) return titles;
    }catch(e){ /* فید بعدی */ }
  }
  return null;
}

/* ---------- نمایش ---------- */
let last = "";
function render(items){
  const key = items.join("|");
  if (key === last) return;          // اگر خبری عوض نشده، حرکت را از نو شروع نکن
  last = key;

  const html = items.map(t => `<span class="item">${esc(t)}</span>`).join("");
  const move = document.getElementById("move");
  move.innerHTML = html + html;       // دو نسخه پشت سر هم برای حلقه بی‌درز

  requestAnimationFrame(() => {
    const pps = parseFloat(getComputedStyle(document.documentElement)
      .getPropertyValue("--pps")) || 45;
    const dur = Math.max(20, (move.scrollWidth / 2) / pps);
    move.style.animation = "none";
    void move.offsetWidth;            // ری‌استارت تمیز انیمیشن
    move.style.animation = `slide ${dur.toFixed(1)}s linear infinite`;
  });
}
function esc(s){
  return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}

async function refresh(){
  const items = await fetchFeed();
  render(items && items.length ? items : FALLBACK);
}
render(FALLBACK);
refresh();
setInterval(refresh, 5 * 60 * 1000);
</script>
</body>
</html>
