const API = '/api/worldcup';
const REFRESH_MS = 60000;
let currentDay = 'today';
let currentLeague = 'epl';
const LEAGUE_TITLES = {

/* ---- Persian names for national teams ---- */
const FA = {

  'Tunisia':'تونس','Algeria':'الجزایر','Egypt':'مصر','Ivory Coast':'ساحل عاج',
  'Australia':'استرالیا','New Zealand':'نیوزیلند','Switzerland':'سوئیس',
  'Austria':'اتریش','Poland':'لهستان','Denmark':'دانمارک','Sweden':'سوئد',
  'Norway':'نروژ','Serbia':'صربستان','Turkey':'ترکیه','Türkiye':'ترکیه',
  'Ukraine':'اوکراین','Scotland':'اسکاتلند','Wales':'ولز','Ireland':'ایرلند',
  'Czech Republic':'جمهوری چک','Czechia':'جمهوری چک','Slovakia':'اسلواکی',
  'Slovenia':'اسلوونی','Romania':'رومانی','Hungary':'مجارستان','Greece':'یونان',
  'Russia':'روسیه','Uzbekistan':'ازبکستان','Jordan':'اردن','Iraq':'عراق',
  'UAE':'امارات','United Arab Emirates':'امارات','China':'چین','India':'هند',
  'Panama':'پاناما','Costa Rica':'کاستاریکا','Honduras':'هندوراس',
  'Jamaica':'جامائیکا','Haiti':'هائیتی','Curacao':'کوراسائو',
  'South Africa':'آفریقای جنوبی','Cape Verde':'کیپ‌ورد','Mali':'مالی',
  'Burkina Faso':'بورکینافاسو','DR Congo':'جمهوری دموکراتیک کنگو',
  'Bolivia':'بولیوی','Venezuela':'ونزوئلا',
  /* باشگاه‌ها */
  'Real Madrid':'رئال مادرید','Barcelona':'بارسلونا','Atletico Madrid':'اتلتیکو مادرید',
  'Atlético Madrid':'اتلتیکو مادرید','Sevilla':'سویا','Real Sociedad':'رئال سوسیداد',
  'Athletic Club':'اتلتیک بیلبائو','Villarreal':'ویارئال','Real Betis':'رئال بتیس',
  'Valencia':'والنسیا','Girona':'خیرونا',
  'Manchester City':'منچسترسیتی','Manchester United':'منچستریونایتد','Liverpool':'لیورپول',
  'Arsenal':'آرسنال','Chelsea':'چلسی','Tottenham Hotspur':'تاتنهام','Tottenham':'تاتنهام',

  'Brighton & Hove Albion':'برایتون','Everton':'اورتون','Nottingham Forest':'ناتینگهام فارست',
  'Bayern Munich':'بایرن مونیخ','FC Bayern Munich':'بایرن مونیخ','Borussia Dortmund':'دورتموند',
  'RB Leipzig':'لایپزیش','Bayer Leverkusen':'لورکوزن','Eintracht Frankfurt':'آینتراخت فرانکفورت',
  'VfB Stuttgart':'اشتوتگارت','Borussia Monchengladbach':'مونشن‌گلادباخ',
  'Borussia Mönchengladbach':'مونشن‌گلادباخ','Werder Bremen':'وردربرمن','Hamburger SV':'هامبورگ',
  'FC Koln':'کلن','1. FC Köln':'کلن','Union Berlin':'یونیون برلین','Wolfsburg':'ولفسبورگ',
  'Juventus':'یوونتوس','Inter Milan':'اینتر','Internazionale':'اینتر','AC Milan':'آث میلان',
  'Napoli':'ناپولی','AS Roma':'آاس رم','Roma':'آاس رم','Lazio':'لاتزیو','Atalanta':'آتالانتا',
  'Fiorentina':'فیورنتینا','Bologna':'بولونیا','Torino':'تورینو',
  'Paris Saint-Germain':'پاری‌سن‌ژرمن','PSG':'پاری‌سن‌ژرمن','Marseille':'مارسی',
  'Olympique Marseille':'مارسی','Lyon':'لیون','Olympique Lyonnais':'لیون','Monaco':'موناکو',
  'AS Monaco':'موناکو','Lille':'لیل','Nice':'نیس','Lens':'لانس','RC Lens':'لانس',
  'Ajax':'آژاکس','PSV Eindhoven':'پی‌اس‌وی','PSV':'پی‌اس‌وی','Feyenoord':'فاینورد',
  'Benfica':'بنفیکا','Porto':'پورتو','FC Porto':'پورتو','Sporting CP':'اسپورتینگ لیسبون',
  'Celtic':'سلتیک','Rangers':'رنجرز','Galatasaray':'گالاتاسرای','Fenerbahce':'فنرباغچه',
  'Fenerbahçe':'فنرباغچه','Besiktas':'بشیکتاش','Beşiktaş':'بشیکتاش',
  'Red Bull Salzburg':'ردبول زالتسبورگ','Shakhtar Donetsk':'شاختار دونتسک',
  'Club Brugge':'کلوب بروژ','Copenhagen':'کپنهاگ','Young Boys':'یانگ بویز'
};
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const faTeam = n => esc(FA[n] || n);

/* ---- Persian digits ---- */
const faNum = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

/* ---- status translation ---- */
const STATUS_LIVE = ['1H','2H','ET','BT','P','HT','LIVE','INT'];
function statusLabel(st, elapsed, extra){
  const map = {
    '1H':'نیمه اول','2H':'نیمه دوم','HT':'بین دو نیمه','ET':'وقت اضافه',
    'BT':'استراحت وقت اضافه','P':'ضربات پنالتی','FT':'پایان بازی',
    'AET':'پایان (وقت اضافه)','PEN':'پایان (پنالتی)','NS':'شروع نشده',
    'SUSP':'متوقف شده','INT':'وقفه','PST':'به تعویق افتاد','CANC':'لغو شد',
    'TBD':'نامشخص','LIVE':'زنده'
  };
  let label = map[st] || st;
  if (elapsed && STATUS_LIVE.includes(st) && st!=='HT' && st!=='P' && st!=='BT'){
    label = 'دقیقه ' + faNum(elapsed) + (extra ? '+' + faNum(extra) : '') + ' · ' + label;
  }
  return label;
}

/* ---- event rendering ---- */
function evIcon(ev){
  const t = (ev.type||'').toLowerCase();
  const d = (ev.detail||'').toLowerCase();
  if (t==='goal'){
    if (d.includes('own')) return '⚽';
    if (d.includes('penalty') && d.includes('missed')) return '❌';
    return '⚽';
  }
  if (t==='card') return d.includes('red') ? '🟥' : '🟨';
  if (t==='subst') return '🔄';
  if (t==='var') return '📺';
  return '•';
}
function evClass(ev){
  const t=(ev.type||'').toLowerCase(), d=(ev.detail||'').toLowerCase();
  if (t==='goal') return 'ev goal';
  if (t==='card' && d.includes('red')) return 'ev redcard';
  return 'ev';
}
function evText(ev){
  const t=(ev.type||'').toLowerCase(), d=(ev.detail||'').toLowerCase();
  const player = esc(ev.player?.name || '؟');
  const assist = ev.assist?.name ? esc(ev.assist.name) : null;
  if (t==='goal'){
    let kind = 'گل!';
    if (d.includes('own')) kind = 'گل به خودی!';
    else if (d.includes('penalty') && d.includes('missed')) kind = 'پنالتی از دست رفت';
    else if (d.includes('penalty')) kind = 'گل از روی نقطه پنالتی!';
    let txt = `<span class="who">${kind} ${player}</span>`;
    if (assist && !d.includes('own')) txt += ` <span class="sub">(پاس گل: ${assist})</span>`;
    return txt;
  }
  if (t==='card'){
    const c = d.includes('red') ? 'کارت قرمز' : 'کارت زرد';
    return `<span class="who">${c}</span> برای ${player}`;
  }
  if (t==='subst'){
    return `<span class="who">تعویض:</span> ${assist||'؟'} وارد شد <span class="sub">(به‌جای ${player})</span>`;
  }
  if (t==='var'){
    return `<span class="who">بررسی VAR</span> <span class="sub">${esc(ev.detail||'')}</span>`;
  }
  return `${esc(ev.type||'')} – ${player}`;
}

/* ---- match card ---- */
function renderMatch(fx){
  const st = fx.fixture.status.short;
  const isLive = STATUS_LIVE.includes(st);
  const home = fx.teams.home, away = fx.teams.away;
  const gh = fx.goals.home, ga = fx.goals.away;
  const kickoff = new Date(fx.fixture.date);
  const timeStr = faNum(kickoff.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}));
  const round = fx.league?.round || '';
  const roundFa = round
    .replace('Quarter-finals','یک‌چهارم نهایی')
    .replace('Semi-finals','نیمه‌نهایی')
    .replace('Round of 16','یک‌هشتم نهایی')
    .replace('Round of 32','یک‌شانزدهم نهایی')
    .replace('3rd Place Final','رده‌بندی')
    .replace('Final','فینال')
    .replace('FIFA World Cup, Group','جام جهانی – گروه')
    .replace('Group Stage','مرحله گروهی');

  let topRight = isLive
    ? `<span class="badge-live">زنده</span>`
    : `<span>${st==='NS' ? 'ساعت ' + timeStr : ''}</span>`;

  const score = (gh===null||ga===null)
    ? '– : –'
    : `${faNum(gh)} : ${faNum(ga)}`;

  let pens = '';
  if (fx.score?.penalty?.home!=null && fx.score?.penalty?.away!=null){
    pens = `<div class="pens">پنالتی: ${faNum(fx.score.penalty.home)} – ${faNum(fx.score.penalty.away)}</div>`;
  }

  const evs = (fx.events||[]);
  let evHtml = '';
  if (evs.length){
    evHtml = '<div class="events">' + evs.map(ev => `
      <div class="${evClass(ev)}">
        <span class="m">${faNum(ev.time?.elapsed ?? '')}${ev.time?.extra?'+'+faNum(ev.time.extra):''}′</span>
        <span class="ico">${evIcon(ev)}</span>
        <span class="txt">${evText(ev)}<div class="ev-team">${faTeam(ev.team?.name||'')}</div></span>
      </div>`).join('') + '</div>';
  } else if (isLive){
    evHtml = '<div class="events"><div class="noev">هنوز رویدادی ثبت نشده</div></div>';
  }

  return `
  <article class="match ${isLive?'is-live':''}">
    <div class="match-top">
      <span>${esc(roundFa)}</span>
      ${topRight}
    </div>
    <div class="scoreline">
      <div class="team">
        <img src="${esc(home.logo)}" alt="" loading="lazy">
        <span class="tname">${faTeam(home.name)}</span>
      </div>
      <div class="score">${score}</div>
      <div class="team">
        <img src="${esc(away.logo)}" alt="" loading="lazy">
        <span class="tname">${faTeam(away.name)}</span>
      </div>
    </div>
    <div class="minute ${isLive?'':'ft'}">${statusLabel(st, fx.fixture.status.elapsed, fx.fixture.status.extra)}</div>
    ${pens}
    ${evHtml}
  </article>`;
}

/* ---- load & render ---- */
async function load(){
  try{
    const res = await fetch(`${API}?day=${currentDay}&league=${currentLeague}`, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const list = data.response || [];
    const app = document.getElementById('app');
    if(!list.length){
      app.innerHTML = '<div class="notice">در این روز بازی‌ای برگزار نمی‌شود.</div>';
    } else {
      // live matches first, then upcoming by time, then finished
      list.sort((a,b)=>{
        const la = STATUS_LIVE.includes(a.fixture.status.short)?0:(a.fixture.status.short==='NS'?1:2);
        const lb = STATUS_LIVE.includes(b.fixture.status.short)?0:(b.fixture.status.short==='NS'?1:2);
        if(la!==lb) return la-lb;
        return new Date(a.fixture.date)-new Date(b.fixture.date);
      });
      app.innerHTML = list.map(renderMatch).join('');
    }
    const now = new Date();
    document.getElementById('updated').textContent =
      'آخرین به‌روزرسانی: ' + faNum(now.toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));
  }catch(e){
    document.getElementById('app').innerHTML =
      `<div class="notice"><strong>خطا در دریافت اطلاعات.</strong><br>
       ارتباط با سرور برقرار نشد. چند لحظه دیگر دوباره تلاش کنید.</div>`;
    document.getElementById('updated').textContent = 'اتصال برقرار نشد';
  }
}

/* ---- league tabs ---- */
document.getElementById('leaguebar').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#leaguebar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentLeague = btn.dataset.league;
  document.getElementById('pageTitle').innerHTML = LEAGUE_TITLES[currentLeague] || 'نتایج زنده';
  document.getElementById('app').innerHTML = '<div class="notice">در حال بارگذاری…</div>';
  load();
});

/* ---- day tabs ---- */
document.getElementById('daybar').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#daybar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentDay = btn.dataset.day;
  document.getElementById('app').innerHTML = '<div class="notice">در حال بارگذاری…</div>';
  load();
});

/* ---- auto refresh (only when tab visible) ---- */
function startTimer(){
  clearInterval(timer);
  timer = setInterval(()=>{ if(!document.hidden) load(); }, REFRESH_MS);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) load(); });

load();
startTimer();
</script>
</body>
