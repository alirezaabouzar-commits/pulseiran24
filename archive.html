<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>آرشیو و جستجو — پالس ایران ۲۴</title>
<meta name="description" content="آرشیو و جستجوی خبرهای پالس ایران ۲۴ — همه‌ی خبرهای گذشته را اینجا پیدا کنید.">
<link rel="icon" href="/favicon.ico">
<style>
  :root{ --bg:#0D1117; --panel:#161b22; --line:#2a2f3a; --gold:#F5C518; --text:#e8edf3; --muted:#9aa4b2; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,'Segoe UI',system-ui,sans-serif;line-height:1.8}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:820px;margin:0 auto;padding:0 18px 80px}

  header{padding:24px 0 18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{color:var(--muted);font-size:14px}
  .back:hover{color:var(--gold)}
  h1{font-size:24px;font-weight:800;margin-top:14px;display:flex;align-items:center;gap:10px}

  .searchbox{display:flex;gap:10px;margin:20px 0}
  .searchbox input{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    color:var(--text);padding:14px 16px;font-family:inherit;font-size:16px;outline:none
  }
  .searchbox input:focus{border-color:var(--gold)}
  .searchbox button{
    background:var(--gold);color:#111;border:none;border-radius:12px;padding:0 22px;
    font-family:inherit;font-weight:800;font-size:16px;cursor:pointer
  }
  .status{color:var(--muted);font-size:14px;margin-bottom:14px}

  .results{display:grid;gap:12px}
  .item{
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
    display:flex;gap:14px;transition:border-color .2s ease
  }
  .item:hover{border-color:var(--gold)}
  .item .thumb{flex-shrink:0;width:84px;height:84px;border-radius:10px;object-fit:cover;background:#0b1017}
  .item .body{flex:1;min-width:0}
  .item .txt{font-weight:700;font-size:15px;line-height:1.9;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .item .meta{color:var(--muted);font-size:12px;margin-top:8px}

  .pager{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:26px}
  .pager button{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);
    padding:10px 18px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px
  }
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .pg{color:var(--muted);font-size:14px}

  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:38px;margin-bottom:10px}
  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topline">
      <a class="back" href="/">‹ بازگشت به سایت</a>
      <span style="color:var(--muted);font-size:13px">pulseiran24.com</span>
    </div>
    <h1>🗂 آرشیو و جستجو</h1>
  </header>

  <div class="searchbox">
    <input type="text" id="q" placeholder="جستجو در خبرها… (مثلاً اقتصاد، تهران، انتخابات)" autocomplete="off">
    <button id="btn">جستجو</button>
  </div>

  <div class="status" id="status">در حال بارگذاری آرشیو…</div>
  <div class="results" id="results"></div>
  <div class="pager" id="pager" style="display:none">
    <button id="prev">‹ جدیدتر</button>
    <span class="pg" id="pg"></span>
    <button id="next">قدیمی‌تر ›</button>
  </div>

  <footer>آرشیو خبری پالس ایران ۲۴</footer>
</div>

<script>
  var qEl = document.getElementById('q');
  var btn = document.getElementById('btn');
  var results = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var pager = document.getElementById('pager');
  var pgEl = document.getElementById('pg');
  var prevBtn = document.getElementById('prev');
  var nextBtn = document.getElementById('next');

  var state = { q: '', page: 1, total: 0, pageSize: 20 };

  function fmtDate(iso){
    if(!iso) return '';
    try{
      var d = new Date(iso);
      return d.toLocaleDateString('fa-IR', { year:'numeric', month:'long', day:'numeric' }) +
             ' · ' + d.toLocaleTimeString('fa-IR', { hour:'2-digit', minute:'2-digit' });
    }catch(e){ return ''; }
  }
  function firstLine(t){ return (t||'').split('\n')[0].slice(0,120); }

  function load(){
    statusEl.textContent = 'در حال جستجو…';
    results.innerHTML = '';
    pager.style.display = 'none';
    var url = '/api/archive?page=' + state.page + (state.q ? ('&q=' + encodeURIComponent(state.q)) : '');
    fetch(url).then(function(r){return r.json();}).then(function(d){
      state.total = d.total || 0;
      state.pageSize = d.pageSize || 20;
      var items = d.items || [];
      if(!items.length){
        statusEl.textContent = '';
        results.innerHTML = '<div class="empty"><div class="big">🔍</div>' +
          '<div style="font-weight:800;color:#e8edf3;font-size:17px;margin-bottom:6px">نتیجه‌ای پیدا نشد</div>' +
          '<div>' + (state.q ? 'برای «' + state.q + '» خبری در آرشیو نبود.' : 'آرشیو هنوز خالی است.') + '</div></div>';
        return;
      }
      var totalPages = Math.max(1, Math.ceil(state.total / state.pageSize));
      statusEl.textContent = state.q
        ? (state.total + ' نتیجه برای «' + state.q + '»')
        : ('مجموع ' + state.total + ' خبر در آرشیو');
      results.innerHTML = items.map(function(x){
        var thumb = x.photo ? '<img class="thumb" src="' + x.photo + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
        return '<a class="item" href="/news/' + x.id + '">' + thumb +
          '<div class="body"><div class="txt">' + escapeHtml(firstLine(x.text)) + '</div>' +
          '<div class="meta">' + fmtDate(x.published) + '</div></div></a>';
      }).join('');
      pgEl.textContent = 'صفحه ' + state.page + ' از ' + totalPages;
      prevBtn.disabled = state.page <= 1;
      nextBtn.disabled = state.page >= totalPages;
      pager.style.display = 'flex';
      window.scrollTo({top:0, behavior:'smooth'});
    }).catch(function(){
      statusEl.textContent = 'خطا در بارگذاری. لطفاً دوباره تلاش کنید.';
    });
  }
  function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function doSearch(){ state.q = qEl.value.trim(); state.page = 1; load(); }
  btn.addEventListener('click', doSearch);
  qEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') doSearch(); });
  prevBtn.addEventListener('click', function(){ if(state.page>1){ state.page--; load(); } });
  nextBtn.addEventListener('click', function(){ state.page++; load(); });

  load();
</script>
</body>
</html>
